# Standalone SPA server (used inside the frontend container).
# In production behind deploy/nginx.conf this file is superseded by the
# reverse proxy, which handles /api itself. Kept for `docker run` / dev.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: page refresh on /clients, /portal/* etc. serves index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets: cache hard, they are content-hashed
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
