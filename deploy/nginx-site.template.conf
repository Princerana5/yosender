# Nginx site template for a Next.js app (PM2 on 127.0.0.1:__PORT__).
# Installed by setup-vps.sh — __DOMAIN__ and __PORT__ are substituted
# automatically. Do NOT edit the installed copy by hand for domain changes;
# re-run setup-vps.sh instead.
server {
  listen 80;
  server_name __DOMAIN__ www.__DOMAIN__;

  # Allow Certbot HTTP-01 challenges
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name __DOMAIN__ www.__DOMAIN__;

  # ── TLS (managed by Certbot; see setup-vps.sh step 6) ──
  ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  client_max_body_size 10m;

  # ── Pass through to Next.js ──
  location / {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Required for Next.js streaming (live progress UIs)
    proxy_buffering off;
    proxy_request_buffering off;
    # Campaign sends are long single requests (60s+/100 groups) —
    # nginx defaults (60s) would 504 them even though sending continues.
    proxy_connect_timeout 360s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;
  }
}
