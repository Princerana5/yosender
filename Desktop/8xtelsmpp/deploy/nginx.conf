# 8xtelSMPP edge reverse proxy.
# One domain serves everything: panel + portal UI at /, API at /api/*.
# TLS certs come from certbot (see docs/deployment.md) and land in
# ./deploy/certs/ (mounted read-only). HTTP only redirects to HTTPS.
#
#   panel.example.com/            → frontend (SPA, refresh-safe)
#   panel.example.com/api/*       → api:8080 (stripped to /*)
#   panel.example.com/api-docs    → api:8080/api-docs (Swagger)

upstream frontend {
  server frontend:80;
}

upstream api {
  server api:8080;
}

# ── HTTP: ACME challenge + redirect ─────────────────────────────────────
server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS ───────────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 5m; # numbers-file uploads
  proxy_read_timeout 120s; # bulk campaign POSTs
  proxy_connect_timeout 10s;

  # API + Swagger (strip the /api prefix)
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location = /api {
    return 301 /api/;
  }

  # Everything else → SPA (nginx inside frontend handles the fallback)
  location / {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
