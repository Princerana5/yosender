# 8xtelSMPP production stack (Linux + Docker, see docs/deployment.md).
#   docker compose up --build -d
# All app services restart automatically and wait for healthy postgres/redis.
# Secrets come from .env (copy .env.prod.example → .env and fill in).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xtel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-xtelsmpp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Internal only — never publish 5432 on a public host.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xtel}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xtel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-xtelsmpp}
      REDIS_URL: redis://redis:6379
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  smpp-server:
    build:
      context: .
      dockerfile: services/smpp-server/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xtel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-xtelsmpp}
      REDIS_URL: redis://redis:6379
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
    ports:
      - "${SMPP_PORT:-2775}:2775"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  vendor-worker:
    build:
      context: .
      dockerfile: services/vendor-worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xtel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-xtelsmpp}
      REDIS_URL: redis://redis:6379
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  routing-worker:
    build:
      context: .
      dockerfile: services/routing-worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xtel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-xtelsmpp}
      REDIS_URL: redis://redis:6379
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dlr-worker:
    build:
      context: .
      dockerfile: services/dlr-worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xtel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-xtelsmpp}
      REDIS_URL: redis://redis:6379
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  billing-worker:
    build:
      context: .
      dockerfile: services/billing-worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xtel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-xtelsmpp}
      REDIS_URL: redis://redis:6379
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      - api
    expose:
      - "80"
    restart: unless-stopped

  # Edge reverse proxy: panel + portal UI at /, API at /api/*, TLS via certbot.
  # SMPP bypasses the proxy (raw TCP straight to smpp-server).
  edge:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  certbot-www:
